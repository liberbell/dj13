<div>
    <h3 class="h6">Comment</h3>
    <div class="list-group">
        <a class="list-group-item list-group-item-action p-3 rounded-0" href="">
            <p class="m-0">
                <small>comment area</small>
            </p>
            <p class="m-0">
                <small>20260919</small>
            </p>
        </a>
    </div>
    
    {% if user.is_authenticated %}
        <form method="POST" class="my-4" action="">
            <div class="mb-2">
                <label for="">Comment</label>
                <textarea class="rounded-0 bg-light form-control" name="" id="" rows="3"></textarea>
            </div>
            <div class="text-right">
                <button class="btn btn-sm btn-outline-success" type="submit">Add comment</button>
            </div>
        </form>
    {% else %}
        <p class="my-4">
            Add comment <a href="/login/">Log in</a>
        </p>
    {% endif %}
        
</div>
