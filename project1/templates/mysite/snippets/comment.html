<div>
    <h3 class="h6">Comment</h3>
    <div class="list-group">

        
        {% for comment in comments %}            
            <a class="list-group-item list-group-item-action p-3 rounded-0" href="">
                <p class="m-0">
                    <small>{{ comment.comment }}</small>
                </p>
                <p class="m-0">
                    <small>{{ comment.created_at }}</small>
                </p>
            </a>
        {% endfor %}
    </div>
    
    {% if user.is_authenticated %}
        <form method="POST" class="my-4" action="">
            {% csrf_token %}

            <div class="mb-2">
                <label for="">Comment</label>
                <textarea class="rounded-0 bg-light form-control" name="comment" id="" rows="3"></textarea>
            </div>
            <div class="text-end">
                <button class="btn btn-sm btn-outline-success" type="submit">Add comment</button>
            </div>
        </form>
    {% else %}
        <p class="my-4">
            Add comment <a href="/login/">Log in</a>
        </p>
    {% endif %}
        
</div>
