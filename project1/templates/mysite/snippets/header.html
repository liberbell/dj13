<div class="container">
    <header class="py-3">
        <div class="row flex-nowrap justify-content-center align-item-center">
            <div class="col-4 text-center">
                <h1 class="display-4 font-italic"><a href="/" class="text-decoration-none">Really Site</a></h1>
            </div>
        </div>
    </header>

    <div class="py-1 mb-2">
        <nav class="nav d-flex justify-content-between">
            <a class="p-2 link-secondary" href="/blog/">Blog</a>
            <a class="p-2 link-secondary" href="#">Contact</a>
            
            {% if user.is_authenticated %}
                {% csrf_token %}
                <a class="p-2 link-secondary" href="/logout">Log out</a>
            {% else %}
                {% csrf_token %}
                <div>
                    <a class="p-2 link-secondary" href="/login">Log in</a>
                    <a class="btn btn-outline-info" href="/logout">Sign up</a>
                </div>
            {% endif %}
                
        </nav>
    </div>
</div>
