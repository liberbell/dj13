{% extends 'mysite/base_auth.html' %}


{% block content %}
    <div class="container">
        <div class="row">
            <div class="col-lg-3 m-auto">
                <h1 class="display-4 font-italic text-center"><a href="/" class="text-decoration-none"Really site></a></h1>
            </div>

            <div class="col-lg-3 m-auto">

                <form class="form-sigin mx-4" action="" method="POST">
                    {% csrf_token %}
                    
                    <div class="text-center">
                        <h1 class="h5 my-4">Log in</h1>
                    </div>

                    <div class="form-label-group my-3">
                        <input type="email" id="id_email" class="form-control" placeholder="Email Address" required autofocus>
                    </div>
                    <div class="form-label-group my-3">
                        <input type="password" id="id_password" class="form-control" placeholder="Password" required>
                    </div>

                    <button class="btn btn-primary btn-block my-3" type="submit">Sign In</button>
                </form>
            </div>
        </div>
    </div>

    {{ req }}
{% endblock content %}
